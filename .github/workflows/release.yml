name: Release

# 推送 v* 标签时自动构建并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 允许创建 Release 与上传产物

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: 跑测试
        run: python -m pytest tests/ -q

      - name: 打包 exe
        run: pyinstaller build.spec --noconfirm

      - name: 提取版本号
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p release
          cp "dist/DSH-manager.exe" "release/DSH-manager-${{ steps.ver.outputs.version }}.exe"

      - name: 从 CHANGELOG 提取当前版本说明
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # 版本号未写进 CHANGELOG 时回退为文件头说明, 避免空描述
          if [ ! -s release_notes.md ]; then
            echo "未在 CHANGELOG.md 找到 [$ver] 小节" > release_notes.md
          fi
          cat release_notes.md

      - name: 创建 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          name: DSH-manager ${{ github.ref_name }}
          body_path: release_notes.md
          append_body: false
          files: release/DSH-manager-${{ steps.ver.outputs.version }}.exe
          draft: false
          prerelease: false
